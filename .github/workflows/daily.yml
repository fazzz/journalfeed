name: journalfeed daily crawl

on:
  schedule:
    # UTC 21:00 = JST 6:00
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Japanese font (for snapshot image)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Fetch new articles (Crossref)
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python main.py

      - name: Enrich abstracts (OpenAlex)
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python enrich_abstracts.py

      - name: Generate report
        run: python report.py

      - name: Generate snapshot image
        run: python generate_snapshot.py

      - name: Commit and push updated data
        run: |
          git config user.name "journalfeed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articles.db reports/ docs/
          git diff --cached --quiet || git commit -m "daily crawl: $(date -u +'%Y-%m-%d')"
          git push
